# /etc/nginx/sites-available/9to1
# Version initiale HTTP — lancer ensuite `sudo certbot --nginx -d 9to1.matthieuguiot.dev`
# qui ajoutera le bloc SSL et la redirection 80 → 443.

server {
    listen 80;
    server_name 9to1.matthieuguiot.dev;

    # API REST + WebSocket de partie (/api/rooms/<code>/ws). Le WebSocket reste ouvert
    # toute la partie sans forcément parler : sans ces délais, nginx le couperait après
    # 60 s de silence (le client se reconnecterait, mais autant éviter le va-et-vient).
    location /api/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
