# PostgreSQL pour le développement local uniquement.
# En production la base est le PostgreSQL du VPS, partagé avec les autres sites.
services:
  db:
    image: postgres:17-alpine
    container_name: games-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: games
      POSTGRES_PASSWORD: games
      POSTGRES_DB: games
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - games-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U games"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  games-pgdata:
